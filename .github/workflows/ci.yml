name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install project with pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c requirements/dev-py312.lock -e '.[dev,cloud]'
      - name: Verify OpenCV 5
        run: reframe-lab doctor --strict-opencv-5
      - name: Test
        run: pytest
